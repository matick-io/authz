name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

env:
  AUTHZ_TEST_DATABASE_URL: postgres://authz:authz@localhost:5432/authz_test?sslmode=disable

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authz
          POSTGRES_PASSWORD: authz
          POSTGRES_DB: authz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Formatted
        run: test -z "$(gofmt -l .)"
      - name: Module files tidy
        run: |
          go mod tidy && (cd tests && go mod tidy)
          git diff --exit-code -- go.mod go.sum tests/go.mod tests/go.sum
      # AI: a real SpiceDB beside the tests, so the samples, the scenarios
      # and the differential rounds hold the engine to the reference
      # implementation's answers, not only to its own.
      - name: Start SpiceDB
        run: |
          docker run -d --name spicedb -p 50051:50051 authzed/spicedb:latest serve --grpc-preshared-key ci --datastore-engine memory
          for i in $(seq 1 30); do docker logs spicedb 2>&1 | grep -q "grpc server started" && break; sleep 1; done
      - name: Vet every module
        run: go vet ./... ./tests/...
      - name: Test every module, Postgres suites and SpiceDB conformance included
        env:
          AUTHZ_SPICEDB: spicedb=127.0.0.1:50051
          AUTHZ_SPICEDB_KEY: ci
        run: go test ./... ./tests/... -count=1

  bench:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: authz
          POSTGRES_PASSWORD: authz
          POSTGRES_DB: authz_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # AI: two SpiceDBs run beside the engine so every kind of ours has a
      # like-for-like column: one on SpiceDB's in-memory datastore against our
      # memory store, one on Postgres, in its own database on the same server
      # as ours, against our Postgres kinds.
      - name: Start SpiceDB on its in-memory datastore
        run: |
          docker run -d --name spicedb-memdb -p 50051:50051 authzed/spicedb:latest serve --grpc-preshared-key ci --datastore-engine memory
          for i in $(seq 1 30); do docker logs spicedb-memdb 2>&1 | grep -q "grpc server started" && break; sleep 1; done
      - name: Start SpiceDB on Postgres
        run: |
          docker run --rm --network host postgres:16 psql postgres://authz:authz@localhost:5432/authz_test -c 'create database spicedb'
          URI='postgres://authz:authz@localhost:5432/spicedb?sslmode=disable'
          docker run --rm --network host authzed/spicedb:latest migrate head --datastore-engine postgres --datastore-conn-uri "$URI"
          docker run -d --name spicedb-postgres --network host authzed/spicedb:latest serve --grpc-preshared-key ci --grpc-addr :50052 --datastore-engine postgres --datastore-conn-uri "$URI"
          for i in $(seq 1 30); do docker logs spicedb-postgres 2>&1 | grep -q "grpc server started" && break; sleep 1; done
      - name: Run the scenario benchmarks
        env:
          AUTHZ_SPICEDB: spicedb-memdb=127.0.0.1:50051,spicedb-postgres=127.0.0.1:50052
          AUTHZ_SPICEDB_KEY: ci
        run: go test ./tests/ -run '^$' -bench BenchmarkScenarios -benchmem -benchtime 300ms -count 1 -timeout 90m | tee bench.txt
      # AI: benchstat is the standard comparison; benchreport lays the same
      # numbers out per scenario with Mermaid charts GitHub renders itself.
      - name: Compare the engines
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          mkdir -p report
          benchstat -col /kind bench.txt | tee report/compare.txt
          go run ./tests/cmd/benchreport bench.txt > report/compare.md
          cp bench.txt report/bench.txt
          {
            echo '## Engine comparison (benchstat, columns are kinds)'
            echo
            echo '```'
            cat report/compare.txt
            echo '```'
            echo
            cat report/compare.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the comparison to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./report
          destination_dir: compare
          keep_files: true
      # AI: github-action-benchmark keeps the history on the gh-pages branch and
      # comments on a pull request when an op slows past the threshold. It is
      # the standard tool for this and needs no code of ours.
      - name: Record and compare against history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: go
          output-file-path: bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-on-alert: true
          summary-always: true
          alert-threshold: "150%"
          fail-on-alert: false
